name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: windows-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the composite customer key
        id: reconciled
        uses: ./
        with:
          left: examples/orders.csv
          right: examples/customers.csv
          keys: |
            customer_id
            region
          measure: revenue
      - name: Detect a missing key column
        id: drift
        continue-on-error: true
        uses: ./
        with:
          left: examples/orders.csv
          right: examples/customers.csv
          keys: customer_id
          measure: revenue
      - name: Verify action outcomes
        shell: bash
        env:
          OK_TOTAL: ${{ steps.reconciled.outputs.after }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          DRIFT_DELTA: ${{ steps.drift.outputs.delta }}
        run: |
          test "$OK_TOTAL" = "10316.00"
          test "$DRIFT_OUTCOME" = "failure"
          test "$DRIFT_DELTA" = "9450.00"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- docs/index.html
      - run: python3 scripts/sql_oracle.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
